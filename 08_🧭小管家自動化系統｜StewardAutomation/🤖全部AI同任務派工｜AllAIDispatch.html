<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🤖全部 AI 同任務派工捷徑</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08101e;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
main{max-width:860px;margin:auto;padding:18px}
.hero,.card{background:#111c31;border:1px solid #344766;border-radius:22px;padding:18px;margin:12px 0}
h1{margin:0 0 8px} h2{margin:0 0 8px}
button,a{display:block;width:100%;padding:14px;border-radius:14px;border:0;text-decoration:none;text-align:center;font-size:17px;font-weight:800;margin-top:10px}
.copy{background:#ffd75e;color:#111}
.open{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
pre{white-space:pre-wrap;word-break:break-word;background:#070c15;border-radius:14px;padding:14px;color:#c5d1e4;max-height:360px;overflow:auto}
.status{color:#9fd8a8}
</style>
</head>
<body>
<main>
<div class="hero">
<h1>🤖 全部 AI 同任務派工捷徑</h1>
<div>同一任務｜每回合 100 個｜全部回指 🧩LKMINI</div>
<button class="copy" onclick="copyTask()">1｜複製完整任務</button>
<div id="status" class="status">等待派工</div>
</div>
<div class="grid" id="grid"></div>
<div class="card">
<h2>📋 同一任務</h2>
<pre id="task"></pre>
</div>
</main>
<script>
const task="# ☠️死亡模式｜GPT檔案庫壓縮檔全量盤點凍結與工具整理\n\n任務：\n搜尋 GPT 檔案庫內全部壓縮檔、凍結包、工具包、安裝包、膠囊包、AI_CORE、三同步包與既有回執。\n\n每回合處理：\n100 個物件。\n\n每個物件執行：\n📖讀取\n🔗掛載\n📍定位\n🧬同名去重\n📂歸位\n🔬驗證\n🧾回執\n📦交付\n\n核心規則：\n1. 引用既有成果，不重做。\n2. 來源檔保持原位。\n3. 正式本名不帶重複數字尾碼。\n4. 名稱相同後再比對 SHA256。\n5. 同名異內容全部保留並建立差異映射。\n6. 已凍結物件只讀。\n7. 每回合交付盤點表、分類表、凍結表、工具表、重複映射、SHA256 對照、驗證報告、執行回執與可視畫面。\n8. 全部回指 🧩LKMINI。\n9. 任務未完成時，下一回合從接續指標繼續處理 100 個。\n\n輸出狀態固定使用：\nVERIFIED_TRUE\nUSER_CONFIRMED\nHYPOTHESIS\nVERIFIED_FALSE\n";
const ais=[{"name": "💬 ChatGPT", "url": "https://chatgpt.com/", "role": "主對話／統整"}, {"name": "⚙️ Codex", "url": "https://chatgpt.com/codex", "role": "程式／GitHub／檔案處理"}, {"name": "🔍 Perplexity", "url": "https://www.perplexity.ai/", "role": "搜尋／交叉查證"}];
document.getElementById('task').textContent=task;
document.getElementById('grid').innerHTML=ais.map((a,i)=>`
<div class="card">
<h2>${a.name}</h2>
<div>${a.role}</div>
<a class="open" href="${a.url}">開啟 ${a.name}</a>
<button class="copy" onclick="copyTask()">複製同一任務</button>
</div>`).join('');
async function copyTask(){
 try{await navigator.clipboard.writeText(task)}
 catch(e){
  const t=document.createElement('textarea');t.value=task;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
 }
 document.getElementById('status').textContent='✓ 任務已複製，現在逐一開啟 AI 貼上執行';
}
</script>
</body>
</html>
