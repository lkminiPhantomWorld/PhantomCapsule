<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>🫧可移動小球分類盤｜MovableDotBoard</title>
<style>
:root{color-scheme:dark;--bg:#0b1022;--card:#182044;--line:#ffffff24;--text:#f8f9ff;--muted:#aeb7d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100svh;background:radial-gradient(circle at 10% 0,#6c58ff38,transparent 36%),linear-gradient(155deg,#0a0e1d,#111832 52%,#0b1022);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.app{max-width:1100px;margin:auto;padding:16px 12px 100px}header{position:sticky;top:0;z-index:20;padding:12px 0;background:#0b1022cc;backdrop-filter:blur(18px)}.hero{padding:16px;border:1px solid var(--line);border-radius:22px;background:#182044e8}.hero h1{margin:0;font-size:clamp(22px,6vw,36px)}.hero p{margin:8px 0 0;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px;overflow:auto;padding:10px 0}.tools button{flex:0 0 auto;border:1px solid var(--line);border-radius:14px;background:#ffffff12;color:white;padding:11px 14px;font-weight:800}.tools .primary{background:linear-gradient(135deg,#786cff,#4f8cff)}.board{position:relative;min-height:1120px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),#0c1228;background-size:24px 24px;overflow:hidden}.zones{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:160px;gap:10px;pointer-events:none}.zone{padding:12px;border:1px dashed #ffffff2b;border-radius:18px;background:#ffffff0d}.zone.hot{border-color:#9db8ff;background:#6384ff29}.zone b{display:block;font-size:13px}.zone small{display:block;margin-top:5px;color:var(--muted)}.dot{position:absolute;width:68px;height:68px;border:1px solid #ffffff70;border-radius:50%;background:radial-gradient(circle at 30% 24%,#fff,#ffffff33 14%,transparent 28%),linear-gradient(145deg,var(--c),#1118);box-shadow:0 14px 30px #0008;transform:translate3d(var(--x),var(--y),0);color:white;font-size:10px;font-weight:900;text-shadow:0 1px 5px #000;touch-action:none;user-select:none}.dot.locked::after{content:"🔒";position:absolute;right:-4px;bottom:-2px;background:#151b38;border-radius:50%;padding:4px}.status{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;margin:auto;max-width:680px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#11182fee;backdrop-filter:blur(18px);font-size:13px}.status strong{display:block}.status span{color:var(--muted)}@media(min-width:760px){.zones{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:180px}.board{min-height:800px}}
</style>
</head>
<body>
<div class="app"><header><div class="hero"><h1>🫧可移動小球分類盤</h1><p>拖曳小球到🥃老K系統既有分類；位置自動保存。所有顯影回指🧩LKMINI。</p></div><div class="tools"><button class="primary" id="add">＋新增小球</button><button id="tidy">🧲自動排好</button><button id="lock">🔓可移動</button><button id="reset">↺重設</button></div></header><main class="board" id="board"><div class="zones" id="zones"></div></main></div><aside class="status"><strong id="name">尚未選取</strong><span id="where">拖曳小球到分類區</span></aside>
<script>
(()=>{"use strict";const KEY="LKMINI_MOVABLE_DOT_BOARD_V2",SIZE=68;const cats=[
["00","00_📥收件箱｜Inbox","尚未讀取／尚未判定"],["01","01_🥳唯一路口｜OnlyEntry","入口／Portal／歡迎頁"],["02","02_🔗掛載引擎庫｜MountEngineLibrary","掛載器／協議／解析接線"],["03","03_🧠知識庫🔬驗證｜KnowledgeVerification","知識／規格／測試證據"],["04","04_🧩零件庫房｜PartsLibrary","工具／模組／能力／零件"],["05","05_👘樣式庫｜StyleLibrary","UI／圖片／媒體／模板"],["06","06_🎮主控台｜ControlConsole","控制面板／互動介面"],["07","07_📸快照｜Snapshot","歷史／差異／恢復點"],["08","08_🧭小管家自動化系統｜StewardAutomation","捷徑／安裝／部署"],["09","09_♾️可逆循環｜ReversibleLoop","同步／還原／回推"],["10","10_👉不好意思右邊請｜RestrictedOrders","🈲禁令／🚨軍令專用"]];
const seed=[["🗜️壓縮檔","#6f7cff"],["🧊凍結包","#46a7dc"],["🛠工具包","#30ba8b"],["📲安裝包","#f08d4f"],["🫧膠囊包","#b06ee8"],["♾️AI_CORE","#e45f9c",true]];const board=document.querySelector("#board"),zones=document.querySelector("#zones"),nameEl=document.querySelector("#name"),whereEl=document.querySelector("#where");let state={locked:false,dots:[]},drag=null;
const id=()=>"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.dots)){state=x;return}}catch{}state.dots=seed.map((s,i)=>({id:id(),name:s[0],color:s[1],protected:!!s[2],cat:"00",x:24+(i%3)*80,y:62+Math.floor(i/3)*80}))}
function renderZones(){zones.innerHTML=cats.map(c=>`<section class="zone" data-cat="${c[0]}"><b>${c[1]}</b><small>${c[2]}</small></section>`).join("")}
function render(){board.querySelectorAll(".dot").forEach(x=>x.remove());state.dots.forEach(d=>{const b=document.createElement("button");b.className="dot"+(d.protected||state.locked?" locked":"");b.dataset.id=d.id;b.style.setProperty("--x",d.x+"px");b.style.setProperty("--y",d.y+"px");b.style.setProperty("--c",d.color);b.textContent=d.name;b.onpointerdown=start;b.onclick=()=>show(d);board.appendChild(b)});document.querySelector("#lock").textContent=state.locked?"🔒全部鎖定":"🔓可移動"}
function show(d){nameEl.textContent=d.name+(d.protected?" 🔒":"");whereEl.textContent=(cats.find(c=>c[0]===d.cat)||cats[0])[1]}
function hit(x,y){return [...document.querySelectorAll(".zone")].find(z=>{const r=z.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom})}
function start(e){const d=state.dots.find(x=>x.id===e.currentTarget.dataset.id);show(d);if(state.locked||d.protected)return;e.preventDefault();const r=board.getBoundingClientRect();drag={d,el:e.currentTarget,p:e.pointerId,ox:e.clientX-r.left-d.x,oy:e.clientY-r.top-d.y};drag.el.setPointerCapture(e.pointerId);drag.el.onpointermove=move;drag.el.onpointerup=end;drag.el.onpointercancel=end}
function move(e){if(!drag||e.pointerId!==drag.p)return;const r=board.getBoundingClientRect();drag.d.x=clamp(e.clientX-r.left-drag.ox,0,board.clientWidth-SIZE);drag.d.y=clamp(e.clientY-r.top-drag.oy,0,board.clientHeight-SIZE);drag.el.style.setProperty("--x",drag.d.x+"px");drag.el.style.setProperty("--y",drag.d.y+"px");const h=hit(e.clientX,e.clientY);document.querySelectorAll(".zone").forEach(z=>z.classList.toggle("hot",z===h))}
function end(e){if(!drag)return;const h=hit(e.clientX,e.clientY);if(h){const target=h.dataset.cat;if(target!=="10"||/(禁令|軍令)/.test(drag.d.name))drag.d.cat=target}document.querySelectorAll(".zone").forEach(z=>z.classList.remove("hot"));show(drag.d);drag=null;save()}
function tidy(){cats.forEach(c=>{const z=document.querySelector(`[data-cat="${c[0]}"]`),zr=z.getBoundingClientRect(),br=board.getBoundingClientRect(),items=state.dots.filter(d=>d.cat===c[0]);items.forEach((d,i)=>{d.x=zr.left-br.left+12+(i%2)*76;d.y=zr.top-br.top+58+Math.floor(i/2)*76})});render();save()}
document.querySelector("#add").onclick=()=>{const n=prompt("小球名稱","新物件");if(!n)return;state.dots.push({id:id(),name:n,color:"#6f7cff",protected:false,cat:"00",x:24,y:62});render();save()};document.querySelector("#tidy").onclick=tidy;document.querySelector("#lock").onclick=()=>{state.locked=!state.locked;render();save()};document.querySelector("#reset").onclick=()=>{localStorage.removeItem(KEY);state={locked:false,dots:[]};load();render();tidy()};renderZones();load();render();window.addEventListener("resize",()=>{state.dots.forEach(d=>{d.x=clamp(d.x,0,board.clientWidth-SIZE);d.y=clamp(d.y,0,board.clientHeight-SIZE)});render();save()});})();
</script>
</body>
</html>
