<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>🪞幻影膠囊開源成果</title>
<style>
:root{--bg:#07101b;--card:#101d2d;--line:#31506c;--text:#f5f8ff;--muted:#b5c3d4;--ok:#8be3ae;--accent:#8adcf8}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#07101b,#0b1522);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6}
main{max-width:820px;margin:auto;padding:16px}
section{background:rgba(16,29,45,.96);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
h1{margin:0 0 8px;font-size:28px}h2{font-size:19px;margin-top:0}
small,.muted{color:var(--muted)}code{color:var(--accent);word-break:break-all}
textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:#07131f;color:#fff;padding:13px;font:inherit}
button,label.action{border:1px solid #406989;border-radius:999px;background:#14283d;color:#fff;padding:10px 13px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.output{min-height:150px;white-space:pre-wrap;word-break:break-word;background:#07131f;border:1px solid var(--line);border-radius:14px;padding:14px}
.ok{color:var(--ok);font-weight:700}
input[type=file]{display:none}
@media(max-width:520px){main{padding:10px}h1{font-size:24px}button,label.action{width:100%;justify-content:center}}
</style>
</head>
<body>
<main>
<section>
<h1>🪞｜幻影膠囊開源成果</h1>
<div>🥃老K系統 → 🧩LKMINI → 🪞幻影膠囊</div>
<div class="muted">根協議：<code>LKMINI://</code>｜A=A｜顯影不等於本體識別</div>
</section>

<section>
<h2>📥 放入自己的內容</h2>
<textarea id="content" placeholder="在這裡輸入文字、筆記或想法。"></textarea>
<div class="actions">
<button id="show" type="button">🪄 顯示</button>
<button id="save" type="button">💾 儲存</button>
<button id="snapshot" type="button">📸 建立快照</button>
<button id="restore" type="button">↩️ 還原快照</button>
<button id="export" type="button">📤 匯出資料</button>
<label class="action" for="importFile">📥 匯入資料</label>
<input id="importFile" type="file" accept="application/json,.json">
</div>
<p id="status" class="muted" aria-live="polite">資料只會留在目前瀏覽器，除非你自己匯出。</p>
</section>

<section>
<h2>🪞 顯示結果</h2>
<div id="output" class="output" aria-live="polite"></div>
</section>

<section>
<h2>🔒 公開邊界</h2>
<p>這個公開頁面只提供可直接使用的成果，不包含製造方法、私有控制內容、內部研究資料或私有座標。</p>
<p class="ok">不連線、不追蹤、不自動上傳。</p>
</section>

<section>
<small>持有人：Kevin Yang／老K<br>
錨點 SHA256：<code>6c0f6f487d8af27de4a8cee9f3fc853f0fbcf417cbd21acb56ac65c55adfcf34</code><br>
授權：MIT</small>
</section>
</main>

<script>
"use strict";
const STATE_KEY="phantom_capsule_public_result_state_v1";
const SNAPSHOT_KEY="phantom_capsule_public_result_snapshot_v1";
const content=document.getElementById("content");
const output=document.getElementById("output");
const status=document.getElementById("status");
function show(message){
  output.textContent=content.value||"（目前沒有內容）";
  if(message) status.textContent=message;
}
function read(key){
  try{return JSON.parse(localStorage.getItem(key)||"null");}
  catch{return null;}
}
document.getElementById("show").addEventListener("click",()=>show("已顯示目前內容。"));
document.getElementById("save").addEventListener("click",()=>{
  localStorage.setItem(STATE_KEY,JSON.stringify({content:content.value,updatedAt:new Date().toISOString()}));
  show("已儲存在目前瀏覽器。");
});
document.getElementById("snapshot").addEventListener("click",()=>{
  localStorage.setItem(SNAPSHOT_KEY,JSON.stringify({content:content.value,createdAt:new Date().toISOString()}));
  status.textContent="已建立最近一次本機快照。";
});
document.getElementById("restore").addEventListener("click",()=>{
  const saved=read(SNAPSHOT_KEY);
  if(!saved){status.textContent="目前沒有可還原的快照。";return;}
  content.value=saved.content||"";
  show("已還原最近一次本機快照。");
});
document.getElementById("export").addEventListener("click",()=>{
  const data=JSON.stringify({format:"🪞幻影膠囊公開成果資料",content:content.value,exportedAt:new Date().toISOString()},null,2);
  const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const a=document.createElement("a");
  a.href=url;
  a.download="🪞幻影膠囊資料.json";
  a.click();
  URL.revokeObjectURL(url);
  status.textContent="已匯出資料。";
});
document.getElementById("importFile").addEventListener("change",async event=>{
  const file=event.target.files&&event.target.files[0];
  if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    if(typeof data.content!=="string") throw new Error("格式不符");
    content.value=data.content;
    show("已匯入資料。");
  }catch{
    status.textContent="匯入失敗：檔案格式不正確。";
  }finally{
    event.target.value="";
  }
});
const saved=read(STATE_KEY);
if(saved&&typeof saved.content==="string"){
  content.value=saved.content;
  show("已讀回目前瀏覽器中的資料。");
}else{
  show();
}
</script>
</body>
</html>
