name: 🔒公開成果中繼資料一致化

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/🔒｜公開成果中繼資料一致化.yml'

permissions:
  contents: write

concurrency:
  group: phantom-capsule-metadata-and-clean-root
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 讀取目前成果
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 修正公開說明並重建無父成果根
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          desired_description='🪞幻影膠囊開源成果｜只公開可直接使用成果，不公開製造方法與私有資料'
          desired_homepage='https://github.com/lkminiPhantomWorld/PhantomCapsule'
          metadata_status="$(curl -sS -o /tmp/metadata-response.json -w '%{http_code}' \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d "$(python - <<PY
import json
print(json.dumps({'description':'''${desired_description}''','homepage':'''${desired_homepage}'''},ensure_ascii=False))
PY
)" || true)"
          echo "中繼資料介面狀態碼=${metadata_status}" >> "$GITHUB_STEP_SUMMARY"

          safe_files=(
            'LICENSE'
            'NOTICE'
            'Projection.svg'
            'README.md'
            '🌐產品顯影.html'
            '📌公開產品入口｜PublicProductEntry.md'
            '📜商業權利與公開邊界｜CommercialRightsAndPublicBoundary.md'
            '📦公開產品清單｜PublicProductManifest.json'
            '🔬公開驗證摘要｜PublicVerificationSummary.json'
            '🪞幻影膠囊'
          )

          rm -rf /tmp/phantom-safe
          mkdir -p /tmp/phantom-safe
          for file in "${safe_files[@]}"; do
            test -f "$file"
            mkdir -p "/tmp/phantom-safe/$(dirname "$file")"
            cp -p "$file" "/tmp/phantom-safe/$file"
          done

          git config user.name 'Kevin Yang'
          git config user.email '242197477+ky46738-ops@users.noreply.github.com'
          git checkout --orphan phantom-metadata-clean-root
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/phantom-safe/. .
          git add --all
          transition_time="$(TZ=Asia/Taipei date '+%Y-%m-%dT%H:%M:%S%z')"
          GIT_AUTHOR_DATE="$transition_time" GIT_COMMITTER_DATE="$transition_time" \
            git commit -m "🔒 幻影膠囊公開成果一致化乾淨根｜${transition_time}"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" = '0'
          test "$(git ls-tree -r --name-only HEAD | wc -l | tr -d ' ')" = '10'
          git push --force origin HEAD:refs/heads/master

          while read -r _ ref; do
            branch="${ref#refs/heads/}"
            if [ "$branch" != 'master' ]; then
              git push origin --delete "$branch"
            fi
          done < <(git ls-remote --heads origin)

          while read -r _ ref; do
            tag="${ref#refs/tags/}"
            git push origin --delete "$tag"
          done < <(git ls-remote --tags origin | awk '!/\^\{\}$/')
